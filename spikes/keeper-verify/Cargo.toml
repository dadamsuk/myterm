[package]
name = "keeper-verify"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not part of the app build.
[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
vt100 = "0.15"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_Threading", "Win32_System_Console", "Win32_System_RemoteDesktop",
  "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_LibraryLoader",
] }
