[package]
name = "myterm"
version = "0.1.0"
description = "One list of every long-running terminal session across all machines"
edition = "2021"
default-run = "myterm"

[lib]
name = "myterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["process", "io-util", "io-std", "net", "sync", "time", "macros", "rt-multi-thread", "fs"] }
portable-pty = "0.9"
notify = "8"
toml = "0.9"
toml_edit = "0.23"
dirs = "6"
glob = "0.3"
anyhow = "1"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_Threading", "Win32_System_Console", "Win32_System_RemoteDesktop",
  "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Environment",
  "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell", "Win32_Graphics_Gdi",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
